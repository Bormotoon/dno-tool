<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="12 12 104 106">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F56"/>
      <stop offset="1" stop-color="#262A3A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2230"/>
      <stop offset="1" stop-color="#151722"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Monitor body -->
  <rect x="16" y="22" width="96" height="60" rx="7" fill="url(#body)" filter="url(#softShadow)"/>

  <!-- Terminal screen -->
  <rect x="18" y="26.125" width="92" height="51.75" rx="5" fill="url(#screen)"/>

  <!-- Bash prompt: user@host -->
  <text x="23" y="39" fill="#00FF9D" font-family="monospace" font-size="7" font-weight="bold">user@host</text>
  <text x="62" y="39" fill="#FFFFFF" font-family="monospace" font-size="7" font-weight="bold">:~$</text>

  <!-- Bash prompt: command line -->
  <text x="23" y="50" fill="#00FF9D" font-family="monospace" font-size="7" font-weight="bold">$</text>
  <text x="32" y="50" fill="#FFFFFF" font-family="monospace" font-size="7">bash</text>

  <!-- Typed command output placeholder -->
  <rect x="23" y="55" width="34" height="2.5" rx="1.25" fill="#8B92A8" opacity="0.45"/>
  <rect x="23" y="61" width="52" height="2.5" rx="1.25" fill="#8B92A8" opacity="0.3"/>

  <!-- Cursor -->
  <rect x="51" y="45.5" width="2" height="5" rx="0.5" fill="#FF375F">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Stand -->
  <path d="M52 84 L76 84 L70 100 L58 100 Z" fill="url(#body)"/>
  <rect x="48" y="100" width="32" height="8" rx="4" fill="url(#body)"/>

  <!-- Neutral indicator -->
  <circle cx="64" cy="92" r="6" fill="#8B92A8"/>
  <circle cx="64" cy="92" r="6" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
</svg>
