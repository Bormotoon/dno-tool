<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
    <title>DNO Tool — Вход</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { display: grid; place-items: center; padding: 16px; background: #0b1220; color: #e6ebf2; font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
        main { width: min(360px, 100%); padding: 28px; background: #1a2233; border: 1px solid #2c3648; border-radius: 12px; }
        main[hidden] { display: none; }
        h1 { margin: 0 0 20px; font-size: 20px; font-weight: 600; }
        label { display: block; margin-bottom: 14px; color: #a7b2c4; font-size: 12px; }
        input { display: block; width: 100%; margin-top: 6px; padding: 10px 11px; background: #0f1623; border: 1px solid #2c3648; border-radius: 8px; color: inherit; font: inherit; }
        input:focus-visible, button:focus-visible { outline: 2px solid #6fa8fa; outline-offset: 1px; }
        button { width: 100%; padding: 10px 14px; background: #2866c4; border: 0; border-radius: 8px; color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
        button:disabled { opacity: .6; cursor: default; }
        #status { min-height: 20px; margin: 12px 0 0; color: #ff9292; font-size: 12px; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <main id="panel" hidden>
        <h1>DNO Tool</h1>
        <form id="form">
            <label>Логин<input id="user" type="text" autocomplete="username" required autofocus></label>
            <label>Пароль<input id="pass" type="password" autocomplete="current-password" required></label>
            <button id="submit" type="submit">Войти</button>
        </form>
        <p id="status" role="alert"></p>
    </main>
    <script src="login.js?v=1"></script>
</body>
</html>
